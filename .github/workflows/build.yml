name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLogs
          path: |
            .buildozer/**/*.log
            .buildozer/**/config.log
